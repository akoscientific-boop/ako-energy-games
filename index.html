<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جدول کلمات متقاطع باتری | آکو انرژی</title>
<style>
:root{--navy:#10283f;--green:#0b966f;--bg:#edf5f3;--muted:#688092}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(155deg,#10283f,#175469);min-height:100vh;color:var(--navy);padding:20px 12px}.app{max-width:510px;margin:auto;background:#fff;border-radius:24px;padding:23px 18px;box-shadow:0 18px 55px #081b2c4d}.eyebrow{font-size:12px;color:var(--green);font-weight:bold;letter-spacing:.2px}h1{font-size:24px;margin:9px 0 5px}p.sub{font-size:13px;color:#597184;line-height:1.9;margin:0 0 13px}.stats{display:flex;justify-content:space-between;background:#edf6f3;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;direction:ltr;background:#173b50;padding:4px;border-radius:12px;max-width:380px;aspect-ratio:1;margin:0 auto}.cell{position:relative;background:white;border:0;border-radius:3px;cursor:pointer;font-size:clamp(21px,6vw,33px);font-family:Tahoma,Arial,sans-serif;color:var(--navy);font-weight:700;min-width:0;display:flex;align-items:center;justify-content:center}.cell.block{background:#173b50;cursor:default}.cell.inword{background:#def4eb}.cell.selected{background:#7bdec1;outline:3px solid var(--green);outline-offset:-3px}.cell.bad{color:#b52e46;background:#ffe7eb}.cell .num{position:absolute;top:3px;left:4px;font:10px Arial,sans-serif;color:#4d6474}.clue-box{margin-top:17px;background:#f2f7f8;padding:12px;border-radius:12px;min-height:78px}.clue-tag{font-size:11px;color:var(--green);font-weight:bold}.clue-text{font-size:15px;font-weight:bold;margin-top:6px;line-height:1.8}.section-title{font-size:14px;font-weight:bold;margin:19px 0 9px}.clues{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clues button{background:white;border:1px solid #d9e6e8;border-radius:10px;padding:10px;text-align:right;color:var(--navy);font:12px Tahoma,Arial,sans-serif;line-height:1.8;cursor:pointer}.clues button.active{border-color:var(--green);background:#e8f8f0}.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;direction:rtl;margin-top:13px}.keyboard button{border:1px solid #d4e3e5;background:#f6faf9;border-radius:8px;padding:9px 0;font-size:18px;cursor:pointer;color:var(--navy)}.keyboard button:active{background:#b9e8d9}.actions{display:flex;gap:8px;margin-top:17px}.actions button{flex:1;border:0;border-radius:11px;padding:13px 7px;font-weight:bold;cursor:pointer;font-family:Tahoma,Arial,sans-serif}.primary{background:var(--green);color:#fff}.secondary{background:#e8eff1;color:var(--navy)}.message{text-align:center;min-height:28px;font-size:13px;font-weight:bold;margin:12px 0 2px;line-height:1.8}.foot{text-align:center;color:#6c8290;font-size:11px;border-top:1px solid #e9f0f1;padding-top:13px;margin-top:10px}@media(max-width:390px){.clues{grid-template-columns:1fr}.app{padding:17px 12px}.keyboard{grid-template-columns:repeat(8,1fr)}}
</style></head>
<body><main class="app"><div class="eyebrow">باشگاه بازی آکو انرژی ⚡</div><h1>جدول کلمات متقاطع باتری</h1><p class="sub">جدول ۵×۵ با موضوع باتری و برق پشتیبان؛ روی یک سؤال یا خانه بزن و حروف جواب را وارد کن.</p><div class="stats"><span>🧩 ۶ واژه</span><span id="progress">۰ از ۶ کامل</span><span id="timer">۰۰:۰۰ ⏱</span></div><div class="board" id="board" role="grid" aria-label="جدول کلمات متقاطع پنج در پنج"></div><div class="clue-box"><div class="clue-tag" id="clueLabel"></div><div class="clue-text" id="clueText"></div></div><div class="section-title">راهنمای سؤال‌ها</div><div class="clues" id="clues"></div><div class="section-title">صفحه‌کلید حروف</div><div class="keyboard" id="keyboard"></div><div class="actions"><button class="primary" id="check">بررسی پاسخ‌ها</button><button class="secondary" id="reset">شروع دوباره</button></div><div class="message" id="message" aria-live="polite"></div><div class="foot">آکو انرژی | آینده روشن است…</div></main>
<script>
// مختصات صفرمبنا؛ جدول آموزشی با یک واژه افقی و پنج واژه عمودی
const words=[
 {id:1,dir:'افقی',answer:'باتری',r:2,c:0,dr:0,dc:1,clue:'وسیله‌ای برای ذخیره انرژی الکتریکی (۵ حرف)'},
 {id:2,dir:'عمودی',answer:'سرب',r:0,c:0,dr:1,dc:0,clue:'فلز اصلی صفحات بسیاری از باتری‌های UPS (۳ حرف)'},
 {id:3,dir:'عمودی',answer:'کابل',r:1,c:1,dr:1,dc:0,clue:'وسیله اتصال الکتریکی بین تجهیزات (۴ حرف)'},
 {id:4,dir:'عمودی',answer:'ولتاژ',r:0,c:2,dr:1,dc:0,clue:'اختلاف پتانسیل الکتریکی؛ معمولاً با ولت بیان می‌شود (۵ حرف)'},
 {id:5,dir:'عمودی',answer:'برق',r:1,c:3,dr:1,dc:0,clue:'انرژی لازم برای راه‌اندازی UPS و تجهیزات (۳ حرف)'},
 {id:6,dir:'عمودی',answer:'اسیدی',r:0,c:4,dr:1,dc:0,clue:'نوع باتری سربی که از الکترولیت اسید استفاده می‌کند (۵ حرف)'}
];
const answer=Array.from({length:5},()=>Array(5).fill(null));const usage=Array.from({length:5},()=>Array.from({length:5},()=>[]));
words.forEach(w=>[...w.answer].forEach((ch,i)=>{const r=w.r+w.dr*i,c=w.c+w.dc*i;if(answer[r][c]&&answer[r][c]!==ch)throw Error('تداخل پاسخ‌ها');answer[r][c]=ch;usage[r][c].push(w.id)}));
let entries=Array.from({length:5},()=>Array(5).fill(''));let active=1,selected=[2,0],start=Date.now(),timerHandle;
const $=s=>document.querySelector(s);function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)])}function word(){return words.find(w=>w.id===active)}function positions(w){return [...w.answer].map((_,i)=>[w.r+w.dr*i,w.c+w.dc*i])}function clearMessage(){$('#message').textContent=''}
function draw(){const b=$('#board');b.innerHTML='';const pos=positions(word()).map(([r,c])=>r+','+c);for(let r=0;r<5;r++)for(let c=0;c<5;c++){const el=document.createElement('button');el.type='button';el.className='cell'+(answer[r][c]?'':' block')+(pos.includes(r+','+c)?' inword':'')+(selected[0]===r&&selected[1]===c?' selected':'');el.setAttribute('aria-label',answer[r][c]?`ردیف ${r+1} ستون ${c+1}: ${entries[r][c]||'خالی'}`:'خانه بسته');if(answer[r][c]){const t=document.createElement('span');t.textContent=entries[r][c];el.append(t);const begins=words.filter(w=>w.r===r&&w.c===c);if(begins.length){const num=document.createElement('small');num.className='num';num.textContent=fa(begins.map(w=>w.id).join('،'));el.append(num)}el.onclick=()=>{if(selected[0]===r&&selected[1]===c&&usage[r][c].length>1){active=usage[r][c].find(id=>id!==active)||active}else if(!usage[r][c].includes(active))active=usage[r][c][0];selected=[r,c];clearMessage();draw()}}else el.disabled=true;b.append(el)}let w=word();$('#clueLabel').textContent=`${w.dir} ${fa(w.id)}`;$('#clueText').textContent=w.clue;$('#clues').innerHTML='';words.forEach(w=>{const bt=document.createElement('button');bt.textContent=`${fa(w.id)}. ${w.dir}: ${w.clue}`;if(w.id===active)bt.classList.add('active');bt.onclick=()=>{active=w.id;selected=positions(w)[0];clearMessage();draw()};$('#clues').append(bt)});$('#progress').textContent=`${fa(words.filter(w=>positions(w).every(([r,c],i)=>entries[r][c]===w.answer[i])).length)} از ${fa(words.length)} کامل`}
function insert(letter){let [r,c]=selected;if(!answer[r][c])return;if(letter==='DEL'){entries[r][c]=''}else{entries[r][c]=letter;let p=positions(word()),idx=p.findIndex(x=>x[0]===r&&x[1]===c);if(idx>=0&&idx<p.length-1)selected=p[idx+1]}clearMessage();draw()}
const keys='ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی'.split('');keys.forEach(k=>{const bt=document.createElement('button');bt.textContent=k;bt.onclick=()=>insert(k);$('#keyboard').append(bt)});const del=document.createElement('button');del.textContent='⌫';del.title='پاک کردن حرف';del.onclick=()=>insert('DEL');$('#keyboard').append(del);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;const normalized={'ي':'ی','ك':'ک','آ':'ا'}[e.key]||e.key;if(keys.includes(normalized)){insert(normalized);e.preventDefault()}else if(e.key==='Backspace'||e.key==='Delete'){insert('DEL');e.preventDefault()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){const w=word(),p=positions(w),i=p.findIndex(([r,c])=>r===selected[0]&&c===selected[1]);selected=p[Math.min(p.length-1,Math.max(0,i+(e.key==='ArrowLeft'||e.key==='ArrowDown'?1:-1)))];draw();e.preventDefault()}});
$('#check').onclick=()=>{let correct=0,filled=0;for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(answer[r][c]){if(entries[r][c])filled++;if(entries[r][c]===answer[r][c])correct++}const total=answer.flat().filter(Boolean).length;$('#message').textContent=correct===total?'🎉 آفرین! همه جواب‌ها درست هستند.':`از ${fa(total)} خانه، ${fa(correct)} حرف درست است. ${filled<total?'هنوز خانه خالی داری.':'دوباره تلاش کن.'}`;$('#message').style.color=correct===total?'#087c55':'#a65e10'};
$('#reset').onclick=()=>{if(!confirm('جدول از ابتدا شروع شود؟'))return;entries=Array.from({length:5},()=>Array(5).fill(''));active=1;selected=[2,0];start=Date.now();clearMessage();draw()};
function tick(){const s=Math.floor((Date.now()-start)/1000);$('#timer').textContent=`${fa(String(Math.floor(s/60)).padStart(2,'0'))}:${fa(String(s%60).padStart(2,'0'))} ⏱`}tick();timerHandle=setInterval(tick,1000);draw();
</script></body></html>
